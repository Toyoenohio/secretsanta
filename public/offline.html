<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin Conexión · Secret Santa</title>
    <style>
      :root {
        --bg: #0f1914;
        --ink: #eef2ef;
        --muted: #a9b8ae;
        --accent: #b3261e;
        --gold: #d9a441;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .star {
        width: 48px;
        height: 48px;
        background-color: var(--gold);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 16px;
        max-width: 380px;
        line-height: 1.5;
      }
      button {
        background-color: var(--accent);
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="star" aria-hidden="true"></div>
    <h1>Sin conexión a internet</h1>
    <p>Parece que has perdido la conexión. Revisa tus datos móviles o WiFi para seguir interactuando en tu sala de Amigo Secreto.</p>
    <button onclick="window.location.reload()">Reintentar conexión</button>
  </body>
</html>
